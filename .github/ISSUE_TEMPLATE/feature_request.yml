name: Feature request / 功能建议
description: Describe the use case and desired behavior.
title: "[Feature] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case / 使用场景
      description: What are you trying to do, and why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 预期行为
      description: Include compatibility requirements and alternatives you have considered.
    validations:
      required: true
